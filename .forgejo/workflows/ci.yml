name: ts-cos CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-cos-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Go and templ checks
    runs-on: terrascale-builder
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.sha }}
          persist-credentials: false
      - name: Generate templ and check committed output
        run: |
          nice -n 19 go tool templ generate
          git diff --exit-code -- '*.templ' '*_templ.go'
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: nice -n 19 go build ./...
      - name: Vet
        run: nice -n 19 go vet ./...
      - name: Test
        run: nice -n 19 go test ./...
