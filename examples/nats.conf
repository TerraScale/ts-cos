# Copy to ~/.config/cos/nats.conf and chmod 0600. Replace both passwords.
# Each node runs `cos serve`; CLI clients connect only to their localhost node.
# For beta/mariogk-dev, change server_name, cluster.listen, and the two peer routes.
server_name: delta
listen: 127.0.0.1:4222

authorization {
  user: cos
  password: "replace-me-client-password"
}

# Alternatively, replace authorization with users: [{ nkey: "<PUBLIC-USER-NKEY>" }]
# inside its block. Put the matching user seed in ~/.config/cos/nats.seed (0600).
jetstream {
  # Omit store_dir to use ~/.local/share/cos/nats, derived from the COS home.
  max_memory_store: 256MB
  max_file_store: 1GB
}

# COS owns this cluster; never use production NATS credentials or routes.
# MagicDNS resolves these hosts to Tailscale addresses; bind the local tailnet host.
cluster {
  name: COS
  listen: delta:6222
  authorization {
    user: cos-route
    password: "replace-me-route-password"
  }
  routes: [
    nats-route://cos-route:replace-me-route-password@beta:6222,
    nats-route://cos-route:replace-me-route-password@mariogk-dev:6222
  ]
}
