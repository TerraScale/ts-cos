# Historical example pending the COS zero-configuration removal thread.
# Production discovers peers over NetBird and receives credentials from OCI Vault.
server_name: delta
listen: 127.0.0.1:4222

authorization {
  user: cos
  password: "replace-me-client-password"
}

# Production credential material is delivered automatically through OCI Vault.
jetstream {
  # Historical tuning values must become fixed in code.
  max_memory_store: 256MB
  max_file_store: 1GB
}

# COS owns this cluster; never use production NATS credentials or routes.
# MagicDNS resolves these hosts to Tailscale addresses; bind the local tailnet host.
cluster {
  name: COS
  listen: delta:6222
  authorization {
    user: cos-route
    password: "replace-me-route-password"
  }
  routes: [
    nats-route://cos-route:replace-me-route-password@beta:6222,
    nats-route://cos-route:replace-me-route-password@mariogk-dev:6222
  ]
}
